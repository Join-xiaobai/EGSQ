# Cephalometric Radiograph Task Configuration (Aariz)

task:
  task_name: "cephalometric_aariz"
  modality: "xray"
  image_size: [512, 512]
  num_landmarks: 29

graph_definition:
  edges:
    - {type: "ANGLE", endpoints: [0, 1, 2], name: "SNA", unit: "degrees", max_tolerance_error: 2.0}
    - {type: "ANGLE", endpoints: [0, 1, 3], name: "SNB", unit: "degrees", max_tolerance_error: 2.0}
    - {type: "ANGLE", endpoints: [2, 1, 3], name: "ANB", unit: "degrees", max_tolerance_error: 1.5}

data:
  dataset_root: "data/aariz_cephalometric"
  pixel_spacing: 0.1  # mm per pixel if available
  group_by_patient: true
